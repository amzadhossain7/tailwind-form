<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form Design</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="h-screen flex justify-center items-center">
        <div class="max-w-5xl w-full bg-white flex flex-col md:flex-row gap-6 p-10 shadow-2xl rounded-xl mx-3">
             <div class="w:full relative md:w-1/2 bg-no-repeat flex justify-center items-center rounded-xl">
                <img src="./image/banner1.png" class="w-full h-full object-cover rounded-xl" alt="banner">
                <div class="absolute inset-0 bg-black bg-opacity-80 rounded-xl"></div>
                <div class="absolute inset-0  flex flex-col justify-center items-center  text-center p-10">
                    <h1 class="text-2xl font-bold text-white py-6">Lets us help you run your own platform</h1>
                    <p class="text-sm text-white">our reqistration process is quicker than other edtech platform</p>
                </div>
             </div>
             <div class="w:full md:w-1/2 ">
                <h1 class="text-2xl font-bold ">Get started</h1>
                <p class="text-gray-600 pb-5">Create your account now!</p>
                <form action="#" class="flex flex-col gap-4">
                    <div>
                        <label for="name" class="text-gray-500 inline-block pb-3">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" class="w-full border px-4 py-2  border-gray-400 rounded-md  focus:outline-none plaxceholder-gray-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="email" class="text-gray-500 inline-block pb-3">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" class="w-full border px-4 py-2  border-gray-400 rounded-md  focus:outline-none plaxceholder-gray-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="password" class="text-gray-500 inline-block pb-3">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" class="w-full border px-4 py-2  border-gray-400 rounded-md  focus:outline-none plaxceholder-gray-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="confirm-password" class="text-gray-500 inline-block pb-3">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" class="w-full border px-4 py-2  border-gray-400 rounded-md  focus:outline-none plaxceholder-gray-500 focus:border-blue-500">
                    </div>
                    <div>
                        <button class="bg-[#0082DF] w-full py-3 font-bold text-white rounded-md hover:bg-[#2f8ed1]">Sign Up</button>
                    </div>
                </form>
                <p class="text-center pt-4">Already a member? <span class="text-[#0082DF]"><a href="">Sign in</a></span></p>
            </div>      
        </div>     
    </div>
    
    <script src="https://kit.fontawesome.com/5935c64e76.js" crossorigin="anonymous"></script>

</body>

</html>
